<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CharmeeyAI — The AI workspace for chat, data & teams</title>
    <meta
      name="description"
      content="Chat with Gemini, turn spreadsheets into charts and insights, and track usage across your team — all in one AI workspace."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('charmeey_theme') || 'system';
          var isLight = theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          var value = isLight ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', value);
          document.documentElement.style.colorScheme = value;
        } catch (e) {}
      })();
    </script>

    <!-- Social preview. Crawlers need absolute URLs: replace /og-image.png with
         https://<your-domain>/og-image.png once the site is deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CharmeeyAI" />
    <meta property="og:title" content="CharmeeyAI — Ask your data anything" />
    <meta
      property="og:description"
      content="The AI workspace for teams: multimodal chat, Data Studio, usage analytics and team admin in one place."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CharmeeyAI dashboard preview with KPI tiles, a revenue chart and an AI insight" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CharmeeyAI — Ask your data anything" />
    <meta name="twitter:description" content="The AI workspace for teams: chat, Data Studio, analytics and admin." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
